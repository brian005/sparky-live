name: Lines (Daily Faceoff, for Sparky Lens)

# Reads Daily Faceoff's 32 line-combination pages once for the whole league and publishes
# data/lines/latest.json, which every Sparky Lens reads instead of scraping Daily Faceoff itself
# (src/df-lines.js has the details). Lens falls back to reading Daily Faceoff on its own when the
# file is missing or more than 8 hours old, so a failed or skipped run costs nothing.
#
# Every 2 hours at :17 (cron is UTC; the off-the-hour minute dodges GitHub's top-of-the-hour backlog).
# A run that changes nothing commits nothing; the file is rewritten at least every 5 hours so its read
# time stays fresh, which also keeps the repo active (GitHub disables schedules after 60 quiet days).

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Write the file even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: lines
  cancel-in-progress: false

jobs:
  lines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # no npm install needed: the script uses only Node built-ins
      - name: Read Daily Faceoff
        run: node src/df-lines.js ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Commit the lines
        shell: bash
        run: |
          git config user.name "sparkybot"
          git config user.email "sparkybot@users.noreply.github.com"
          git add data/lines/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Lines $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase --quiet && git push --quiet && break; sleep 5; done
