name: Records (Screech, set or tied)

# Checks whatever just became final (last night, and any period that just ended) against every season
# since 2013-14, and posts to #sparky when a franchise sets or ties a record, pool-wide or its own.
# Quiet when nothing's set.
#
# 10:30 PM Pacific: tallies TONIGHT's games (nightly-report.js --date today, no Slack post) and checks
# them, but only once every game is final. Cron is UTC and doesn't follow DST, so it fires at 05:30 and
# 06:30 UTC: 10:30 / 11:30 PM in PDT, 9:30 / 10:30 PM in PST. The early one usually finds a late game
# still going and waits; the later one gets it. Running twice is harmless.
#
# Mornings, right after the Nightly report: catches up anything the night run couldn't finish (a game
# that went long), and checks periods. A period's last night only reaches F2's totals after midnight,
# so period records post the morning after a period ends.
#
# data/records/state.json remembers what's been checked, so nothing is announced twice.

on:
  workflow_run:
    workflows: ["Nightly report (eligible vs scored, A1/A2, PP/EN)"]
    types: [completed]
  schedule:
    - cron: "30 5 * * *"     # 22:30 PDT / 21:30 PST
    - cron: "30 6 * * *"     # 23:30 PDT / 22:30 PST
  workflow_dispatch:
    inputs:
      slack:
        description: "Post to Slack (off = print only, state untouched)"
        type: boolean
        default: true
      channel:
        description: "Slack channel ID to post to instead (blank = #sparky). Test posts never save state."
        required: false
        default: ""
      book:
        description: "Just print the record book in the log"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: records
  cancel-in-progress: false

jobs:
  records:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # the nightly report commits last night's file just before this runs: make sure we have it
      - name: Latest data
        shell: bash
        run: git pull --quiet origin "${{ github.event.repository.default_branch }}" || true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build args
        id: args
        shell: bash
        run: |
          A=""
          [ "${{ github.event.inputs.slack }}" = "false" ] && A="$A --no-slack"
          [ "${{ github.event.inputs.book }}" = "true" ] && A="$A --book"
          [ -n "${{ github.event.inputs.channel }}" ] && A="$A --test"
          echo "args=$A" >> "$GITHUB_OUTPUT"

      # tonight's games, tallied the same way the morning nightly report does (it overwrites this file
      # tomorrow morning with the same numbers). Not needed on the morning run: that's what just ran.
      - name: Tonight's games
        if: github.event_name != 'workflow_run'
        continue-on-error: true        # if this fails, still check whatever's already final
        env:
          F2_BASE: ${{ vars.F2_BASE }}
          F2_USER: ${{ secrets.F2_USER }}
          F2_PASSWORD: ${{ secrets.F2_PASSWORD }}
        shell: bash
        run: node src/nightly-report.js --date "$(TZ=America/Vancouver date +%F)" --no-slack

      # no npm install needed: the script uses only Node built-ins
      - name: Records
        env:
          F2_BASE: ${{ vars.F2_BASE }}
          F2_USER: ${{ secrets.F2_USER }}
          F2_PASSWORD: ${{ secrets.F2_PASSWORD }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ github.event.inputs.channel || vars.RECORDS_SLACK_CHANNEL || vars.F1_MIRROR_SLACK_CHANNEL }}
          SLACK_USERNAME: ${{ vars.RECORDS_SLACK_USERNAME || 'Screech' }}
          SLACK_ICON: ${{ vars.RECORDS_SLACK_ICON || ':trophy:' }}
        run: node src/records.js ${{ steps.args.outputs.args }}

      - name: Commit state
        if: always()
        shell: bash
        run: |
          git config user.name "sparkybot"
          git config user.email "sparkybot@users.noreply.github.com"
          git add data/records/ data/nightly-report/ data/nhl-ids.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Records $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase --quiet && git push --quiet && break; sleep 5; done
